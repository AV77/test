<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Presentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Reveal.js Core CSS (via cdnjs) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reset.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/theme/black.min.css">
</head>
<body>

  <div class="reveal">
    <div class="slides">
      
      <section>
        <h2>Slide 1: Intro</h2>
        <p>This is the main screen.</p>
        <aside class="notes">
          These are notes for Slide 1.<br>
          Only the presenter sees this.
        </aside>
      </section>

    </div>
  </div>

  <!-- Reveal.js Core JS & Notes Plugin (via cdnjs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/notes/notes.min.js"></script>

  <script>
    Reveal.initialize({
      hash: true,
      // The plugin will now load correctly
      plugins: [ RevealNotes ]
    });
  </script>
</body>
</html>
